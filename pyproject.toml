[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-matrix-adapter"
version = "1.0.0"
description = "Turnkey Sovereign Skill, Memory & ActionLedger Adapter for Nous Research Hermes Agent & Paperclip Company OS"
readme = "README.md"
authors = [
    { name = "Ahmed Hassan", email = "aah@a2zsoc.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "hermes-agent",
    "nous-research",
    "paperclip",
    "agentic-infrastructure",
    "episodic-memory",
    "action-ledger",
    "palantir-ontology",
    "fde",
    "zero-dependency"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_matrix_adapter*"]
